<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LunesFC — El FIFA del Fútbol Amateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN TOKENS — LUNESFC UNICORN
   "FIFA 26 × Tesla UI × PlayStation 6"
═══════════════════════════════════════════════════════ */
:root{
  /* Core palette */
  --bg:#060810;
  --bg2:#090d16;
  --sf:#0d1424;
  --sf2:#111929;
  --sf3:#162032;
  --br:#1c2b42;
  --br2:#243650;

  /* Accent system */
  --cyan:#00d4ff;
  --cyan2:#0099cc;
  --orange:#ff6b00;
  --orange2:#cc4400;
  --green:#00e676;
  --gold:#ffd600;
  --gold2:#ffab00;
  --purple:#7c3aed;
  --pink:#ff0080;
  --red:#ff1744;

  /* Text */
  --tx:#e8f4ff;
  --tx2:#a0b4cc;
  --tx3:#5a7090;

  /* Special */
  --glass:rgba(13,20,36,.85);
  --glow-cyan:0 0 20px rgba(0,212,255,.3);
  --glow-gold:0 0 20px rgba(255,214,0,.3);
  --glow-orange:0 0 20px rgba(255,107,0,.3);

  /* Layout */
  --th:68px;
  --safe:env(safe-area-inset-bottom, 0px);
}

/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Rajdhani',sans-serif;
  background:var(--bg);
  color:var(--tx);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}

/* ── APP SHELL ── */
#app{height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex-direction:column;height:100%;position:relative}
.screen.active{display:flex}

/* ══════════════════════════════════════════════════════
   LOADING SCREEN — Cinematic intro
══════════════════════════════════════════════════════ */
#loading-overlay{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;transition:opacity .5s ease;
}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.load-logo-wrap{position:relative;margin-bottom:12px}
.load-logo{
  font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:6px;
  background:linear-gradient(135deg,var(--cyan),#0055ff,var(--cyan));
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:logoShimmer 2s ease infinite;
}
@keyframes logoShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.load-ring{
  width:48px;height:48px;
  border:2px solid var(--br2);
  border-top-color:var(--cyan);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-top:24px;
}
.load-tagline{font-size:11px;color:var(--tx3);letter-spacing:4px;text-transform:uppercase;margin-top:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════════════════════════════
   AUTH SCREEN
══════════════════════════════════════════════════════ */
#auth-screen{
  background:radial-gradient(ellipse at 50% -10%,#0a1e3a 0%,var(--bg) 65%);
  align-items:center;justify-content:center;
  padding:24px;overflow-y:auto;
}
/* Field lines decoration */
#auth-screen::before{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(rgba(0,212,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,.04) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}
.auth-logo{text-align:center;margin-bottom:32px;position:relative}
.auth-ball{font-size:56px;display:block;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(0,212,255,.4))}
.brand{
  font-family:'Bebas Neue',sans-serif;font-size:60px;letter-spacing:5px;
  background:linear-gradient(135deg,var(--cyan),#0077ff,var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;
}
.brand-badge{
  display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;margin-top:4px;
}
.tagline{font-size:12px;color:var(--tx3);letter-spacing:3px;text-transform:uppercase;margin-top:6px}

.auth-card{
  background:var(--glass);
  border:1px solid var(--br2);
  border-radius:20px;
  padding:28px;width:100%;max-width:400px;
  backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
}
.auth-tabs{display:flex;margin-bottom:24px;gap:8px}
.auth-tab{
  flex:1;padding:11px;text-align:center;
  font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:10px;border:1px solid var(--br);color:var(--tx3);
  transition:all .25s;
}
.auth-tab.active{background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(0,119,255,.15));border-color:var(--cyan);color:var(--cyan)}

.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;color:var(--tx3);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase}
.form-input{
  width:100%;padding:12px 14px;
  background:rgba(0,0,0,.3);
  border:1px solid var(--br);
  border-radius:10px;color:var(--tx);
  font-size:15px;transition:border-color .2s,box-shadow .2s;
  -webkit-appearance:none;
}
.form-input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn-primary{
  width:100%;padding:15px;border-radius:12px;
  background:linear-gradient(135deg,var(--cyan),#0077ff);
  color:#000;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  transition:all .2s;margin-top:8px;
  box-shadow:0 8px 24px rgba(0,212,255,.25);
}
.btn-primary:active{transform:scale(.97);opacity:.9}
.btn-secondary{
  width:100%;padding:12px;border-radius:10px;
  background:transparent;border:1px solid var(--br2);
  color:var(--tx2);font-size:14px;font-weight:600;
  transition:all .2s;
}
.btn-secondary:active{border-color:var(--cyan);color:var(--cyan)}
.btn-danger{
  width:100%;padding:12px;border-radius:10px;
  background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.3);
  color:var(--red);font-size:14px;font-weight:600;
}

.auth-form{display:none}
.auth-form.active{display:block}
.form-error{color:var(--red);font-size:13px;margin-top:8px;display:none;padding:8px 12px;background:rgba(255,23,68,.1);border-radius:8px;border-left:2px solid var(--red)}
.form-error.show{display:block}

/* ══════════════════════════════════════════════════════
   GROUP SCREEN
══════════════════════════════════════════════════════ */
#group-screen{
  background:var(--bg2);
  align-items:center;padding:0;overflow-y:auto;
}
.group-hero{
  width:100%;padding:40px 24px 24px;
  background:linear-gradient(180deg,rgba(0,212,255,.06) 0%,transparent 100%);
  text-align:center;position:relative;
}
.group-hero::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--br2),transparent);
}
.group-hero-title{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:4px;color:var(--cyan)}
.group-hero-sub{font-size:13px;color:var(--tx3);margin-top:4px}
.group-welcome-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--sf2);border:1px solid var(--br);
  border-radius:20px;padding:8px 16px;margin-top:12px;
  font-size:14px;font-weight:600;
}
.group-welcome-avatar{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),#0077ff);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#000;
}
.group-actions{width:100%;max-width:440px;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.group-action-card{
  background:var(--sf);border:1px solid var(--br);border-radius:16px;padding:20px;
  transition:border-color .2s;
}
.group-action-card:focus-within{border-color:var(--cyan)}
.group-action-title{
  font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.group-list{margin-top:4px;display:flex;flex-direction:column;gap:6px}
.group-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px;background:var(--bg);border:1px solid var(--br);
  border-radius:12px;cursor:pointer;transition:all .2s;
}
.group-item:active{border-color:var(--cyan);transform:scale(.99)}
.group-item-left{display:flex;align-items:center;gap:12px}
.group-item-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(0,119,255,.2));
  border:1px solid rgba(0,212,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.group-item-name{font-weight:700;font-size:15px}
.group-item-meta{font-size:11px;color:var(--tx3);margin-top:2px}
.group-item-arrow{color:var(--tx3);font-size:18px}
.btn-logout{
  position:fixed;top:16px;right:16px;z-index:50;
  color:var(--tx3);font-size:12px;padding:6px 14px;
  border:1px solid var(--br);border-radius:20px;background:var(--sf);
  letter-spacing:.5px;
}
.join-input{
  text-transform:uppercase;letter-spacing:6px;font-size:22px;
  text-align:center;font-family:'Bebas Neue',sans-serif;
}

/* ══════════════════════════════════════════════════════
   MAIN SCREEN
══════════════════════════════════════════════════════ */
#main-screen{background:var(--bg)}
.main-content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 16px calc(var(--th) + var(--safe) + 16px);
  -webkit-overflow-scrolling:touch;
}

/* ── TAB BAR — Glassmorphism v2 ── */
.tab-bar{
  height:var(--th);
  background:rgba(6,8,16,.92);
  border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  display:flex;align-items:center;flex-shrink:0;
  padding:6px 8px calc(6px + var(--safe));
  gap:4px;
  position:relative;
}
/* Top cyan line */
.tab-bar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 5%,rgba(0,212,255,.25) 50%,transparent 95%);
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--tx3);font-size:8.5px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;
  padding:7px 2px;border-radius:12px;
  position:relative;
  transition:color .2s ease, background .2s ease;
  -webkit-tap-highlight-color:transparent;
}
/* Active pill highlight */
.tab-item.active{
  color:var(--cyan);
  background:rgba(0,212,255,.1);
}
/* Cyan dot indicator at top of pill */
.tab-item.active::before{
  content:'';
  position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:20px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  box-shadow:0 0 6px rgba(0,212,255,.6);
}
/* Icon bounce on activate */
@keyframes tabBounce{0%{transform:scale(1)}40%{transform:scale(1.25) translateY(-2px)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.tab-item.active .tab-icon{
  animation:tabBounce .35s cubic-bezier(.22,1,.5,1);
  filter:drop-shadow(0 0 6px rgba(0,212,255,.5));
}
.tab-icon{font-size:19px;line-height:1;transition:filter .2s}
/* Live tab special state — pulsing red when match active */
.tab-item.live-active{color:var(--red);background:rgba(255,23,68,.1)}
.tab-item.live-active::before{
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  box-shadow:0 0 6px rgba(255,23,68,.6);
}
.tab-item.live-active .tab-icon{
  animation:tabBounce .35s cubic-bezier(.22,1,.5,1), liveDot 1.4s ease infinite;
}
@keyframes liveDot{0%,100%{filter:drop-shadow(0 0 4px rgba(255,23,68,.4))}50%{filter:drop-shadow(0 0 10px rgba(255,23,68,.8))}}

/* ══════════════════════════════════════════════════════
   PAGE HEADER
══════════════════════════════════════════════════════ */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;padding:4px 0 20px;gap:12px}
.page-title{
  font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--tx),var(--tx2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.page-subtitle{font-size:12px;color:var(--tx3);margin-top:2px;letter-spacing:.5px}

/* ══════════════════════════════════════════════════════
   PLAYER CARDS — FIFA UT Style v2
══════════════════════════════════════════════════════ */
.players-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:400px){.players-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:520px){.players-grid{grid-template-columns:repeat(3,1fr)}}

/* Stagger entrance animation */
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.player-card{
  border-radius:18px;
  padding:0;
  cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .18s cubic-bezier(.22,1,.5,1),box-shadow .18s;
  background:var(--card-bg,linear-gradient(160deg,#111d30 0%,#0d1624 60%,#090d16 100%));
  border:1px solid var(--card-border,var(--br));
  box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);
  animation:cardIn .35s cubic-bezier(.22,1,.5,1) both;
}
/* Tier-specific themes */
.player-card.elite{
  --card-bg:linear-gradient(160deg,#1a1400 0%,#141000 50%,#0a0c14 100%);
  --card-border:rgba(255,214,0,.35);
  --card-top:linear-gradient(90deg,var(--gold),var(--gold2),#ff9900,var(--gold));
  --card-glow:rgba(255,200,0,.18);
  --card-shimmer:rgba(255,214,0,.06);
}
.player-card.good{
  --card-bg:linear-gradient(160deg,#001a0f 0%,#001208 50%,#090d16 100%);
  --card-border:rgba(0,230,118,.3);
  --card-top:linear-gradient(90deg,var(--green),#00bfa5,var(--green));
  --card-glow:rgba(0,230,118,.14);
  --card-shimmer:rgba(0,230,118,.05);
}
.player-card.avg{
  --card-bg:linear-gradient(160deg,#001628 0%,#000e1e 50%,#060810 100%);
  --card-border:rgba(0,212,255,.25);
  --card-top:linear-gradient(90deg,var(--cyan),#0077ff,var(--cyan));
  --card-glow:rgba(0,212,255,.12);
  --card-shimmer:rgba(0,212,255,.04);
}
/* Animated top accent bar */
.player-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--card-top,linear-gradient(90deg,var(--cyan),transparent));
  background-size:200% 100%;
  animation:shimmerBar 3s ease infinite;
}
@keyframes shimmerBar{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
/* Glow radial background */
.player-card::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,var(--card-glow,rgba(0,212,255,.1)) 0%,transparent 65%);
  pointer-events:none;
}
.player-card:active{transform:scale(.95);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.player-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.5)}

/* ── TOP SECTION: badges, foot, overall ── */
.pc-top{
  padding:12px 12px 8px;
  display:flex;align-items:flex-start;justify-content:space-between;
  position:relative;
}
.pc-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pc-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.player-card-foot{
  font-size:9px;font-weight:800;color:rgba(255,255,255,.5);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  border-radius:4px;padding:2px 6px;letter-spacing:.5px;
}
.confirmed-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green),0 0 12px rgba(0,230,118,.4);
  animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 6px var(--green),0 0 12px rgba(0,230,118,.3)}50%{box-shadow:0 0 10px var(--green),0 0 20px rgba(0,230,118,.5)}}
.mvp-crown{font-size:14px;filter:drop-shadow(0 0 6px var(--gold));animation:crownBob 2.5s ease-in-out infinite}
@keyframes crownBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.elo-badge{
  font-size:9px;font-weight:800;letter-spacing:.5px;
  background:rgba(124,58,237,.25);border:1px solid rgba(124,58,237,.4);
  color:#b08dff;border-radius:4px;padding:2px 5px;
}

/* ── OVERALL NUMBER ── */
.pc-overall-wrap{
  text-align:center;padding:0 12px;
  display:flex;flex-direction:column;align-items:center;
}
.player-card-overall{
  font-family:'Bebas Neue',sans-serif;font-size:54px;line-height:.95;
  text-align:center;
  filter:drop-shadow(0 0 12px var(--ovr-glow,rgba(0,212,255,.4)));
}
.player-card-pos{
  font-size:9px;color:rgba(255,255,255,.4);text-align:center;
  text-transform:uppercase;letter-spacing:2px;margin-top:2px;
}

/* ── AVATAR ── */
.pc-avatar-wrap{
  display:flex;justify-content:center;padding:4px 0 6px;
  position:relative;
}
.player-card-avatar{
  width:60px;height:60px;border-radius:50%;
  background:var(--avatar-bg,linear-gradient(135deg,var(--cyan),#0077ff));
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:24px;color:#000;
  box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.07);
  position:relative;z-index:1;
}
/* Subtle ring behind avatar */
.pc-avatar-wrap::before{
  content:'';position:absolute;
  width:68px;height:68px;border-radius:50%;
  background:var(--card-glow,rgba(0,212,255,.1));
  border:1px solid var(--card-border,rgba(0,212,255,.2));
  top:50%;left:50%;transform:translate(-50%,-50%);
}

/* ── NAME ── */
.pc-name-wrap{padding:0 10px 8px;text-align:center}
.player-card-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  line-height:1.15;color:var(--tx);
}
.player-card-sub{font-size:10px;color:var(--tx3);margin-top:2px;letter-spacing:.3px}

/* ── SKILL MICRO-BARS ── */
.pc-skills{
  padding:8px 10px 10px;
  border-top:1px solid rgba(255,255,255,.05);
  display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;
}
.pc-skill-row{display:flex;align-items:center;gap:5px}
.pc-skill-name{font-size:8px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.35);text-transform:uppercase;width:22px;flex-shrink:0}
.pc-skill-track{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.pc-skill-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.pc-skill-val{font-family:'Bebas Neue',sans-serif;font-size:12px;color:rgba(255,255,255,.5);min-width:16px;text-align:right}

/* ── MINI STATS ROW (legacy compat) ── */
.mini-stats-row{display:flex;justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini-stat{font-size:9px;font-weight:700;letter-spacing:.5px;background:rgba(255,255,255,.05);border-radius:4px;padding:2px 5px;color:var(--tx2)}

/* ══════════════════════════════════════════════════════
   PLAYER DETAIL MODAL
══════════════════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-sheet{
  background:var(--sf);
  border-radius:24px 24px 0 0;
  width:100%;max-width:480px;
  max-height:92dvh;overflow-y:auto;
  transform:translateY(80px);
  transition:transform .35s cubic-bezier(.22,1.2,.5,1);
  border-top:1px solid var(--br2);
  box-shadow:0 -20px 60px rgba(0,0,0,.5);
}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--br2);border-radius:2px;margin:14px auto 0}
.modal-body{padding:20px 20px 40px}
.modal-close{
  position:absolute;top:16px;right:16px;
  color:var(--tx3);font-size:20px;
  width:34px;height:34px;
  background:var(--sf2);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}

/* ── PLAYER DETAIL HEADER ── */
.detail-hero{
  text-align:center;padding:20px 16px 24px;
  background:linear-gradient(180deg,rgba(0,212,255,.08) 0%,transparent 100%);
  border-radius:16px;margin-bottom:20px;
  position:relative;
}
.detail-overall{
  font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:1;
  text-shadow:0 0 40px currentColor;
}
.detail-name{
  font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;margin-top:4px;
}
.detail-meta{font-size:13px;color:var(--tx3);margin-top:4px}
.detail-chips{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}

/* ── RADAR CHART AREA ── */
.radar-container{margin-bottom:20px}
.radar-title{font-size:11px;color:var(--tx3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;text-align:center}
canvas.radar-canvas{display:block;margin:0 auto}

/* ── STAT BARS ── */
.stat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stat-bar-label{font-size:11px;color:var(--tx3);width:75px;flex-shrink:0;letter-spacing:.5px;text-transform:uppercase}
.stat-bar-track{flex:1;height:5px;background:var(--br);border-radius:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.stat-bar-fill.elite{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.stat-bar-fill.good{background:linear-gradient(90deg,var(--green),#00bfa5)}
.stat-bar-fill.avg{background:linear-gradient(90deg,var(--cyan),var(--cyan2))}
.stat-bar-fill.low{background:linear-gradient(90deg,var(--orange),var(--orange2))}
.stat-bar-val{font-size:13px;font-weight:700;width:30px;text-align:right}

/* ══════════════════════════════════════════════════════
   ELO & RANKING
══════════════════════════════════════════════════════ */
.elo-display{
  background:var(--sf2);border:1px solid rgba(124,58,237,.3);border-radius:12px;
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.elo-left{display:flex;align-items:center;gap:10px}
.elo-icon{font-size:24px}
.elo-label{font-size:11px;color:var(--tx3);letter-spacing:1px}
.elo-number{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#b08dff}
.elo-rank{
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:4px 10px;border-radius:6px;
}
.elo-rank.legend{background:linear-gradient(135deg,rgba(255,214,0,.2),rgba(255,107,0,.2));color:var(--gold);border:1px solid rgba(255,214,0,.3)}
.elo-rank.diamond{background:rgba(0,212,255,.15);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
.elo-rank.gold{background:rgba(255,214,0,.15);color:var(--gold2);border:1px solid rgba(255,214,0,.3)}
.elo-rank.silver{background:rgba(160,180,204,.15);color:var(--tx2);border:1px solid var(--br2)}
.elo-rank.bronze{background:rgba(255,107,0,.15);color:var(--orange);border:1px solid rgba(255,107,0,.3)}

/* ══════════════════════════════════════════════════════
   ATTENDANCE
══════════════════════════════════════════════════════ */
.attendance-list{display:flex;flex-direction:column;gap:8px}
.attendance-item{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--sf2);border:1px solid var(--br);border-radius:14px;padding:14px;
  transition:border-color .2s;
}
.attendance-item.is-confirmed{border-color:rgba(0,230,118,.2)}
.attendance-info{display:flex;align-items:center;gap:12px}
.attendance-avatar{
  width:42px;height:42px;border-radius:50%;
  background:var(--avatar-bg,linear-gradient(135deg,var(--cyan),#0077ff));
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:18px;color:#000;flex-shrink:0;
}
.attendance-name{font-weight:700;font-size:15px}
.attendance-meta{font-size:11px;color:var(--tx3);margin-top:2px}
.attendance-toggle{
  padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;transition:all .2s;border:1px solid;
}
.attendance-toggle.confirmed{background:rgba(0,230,118,.15);border-color:var(--green);color:var(--green)}
.attendance-toggle.absent{background:transparent;border-color:var(--br);color:var(--tx3)}
.attendance-toggle.mine-yes{
  background:linear-gradient(135deg,var(--cyan),#0077ff);
  border-color:transparent;color:#000;
  box-shadow:0 4px 12px rgba(0,212,255,.25);
}
.attendance-toggle.mine-no{background:rgba(255,255,255,.05);border-color:var(--br2);color:var(--tx2)}

/* ── Confirmed counter pill ── */
.conf-hero{
  background:var(--sf2);border:1px solid var(--br);border-radius:16px;
  padding:20px;margin-bottom:16px;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;text-align:center;
}
.conf-hero-item{padding:4px 8px;position:relative}
.conf-hero-item:not(:last-child)::after{
  content:'';position:absolute;right:0;top:20%;bottom:20%;
  width:1px;background:var(--br);
}
.conf-hero-val{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--cyan)}
.conf-hero-lbl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px}

/* ══════════════════════════════════════════════════════
   TEAMS
══════════════════════════════════════════════════════ */
.teams-container{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.team-card{
  background:var(--sf2);border-radius:16px;padding:14px;
  border:1px solid transparent;transition:border-color .3s;
}
.team-card.team-a{border-color:rgba(0,212,255,.25);background:linear-gradient(180deg,rgba(0,212,255,.06) 0%,var(--sf2) 100%)}
.team-card.team-b{border-color:rgba(255,107,0,.25);background:linear-gradient(180deg,rgba(255,107,0,.06) 0%,var(--sf2) 100%)}
.team-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.team-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.team-ovr{font-family:'Bebas Neue',sans-serif;font-size:32px}
.team-player{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px;border-radius:8px;background:rgba(0,0,0,.2)}
.team-player-num{
  width:18px;height:18px;border-radius:50%;
  background:var(--br);display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;flex-shrink:0;
}
.team-player-name{font-size:12px;font-weight:600;flex:1;line-height:1.2}
.team-player-ovr{font-size:11px;color:var(--tx3)}

.draw-btn{
  width:100%;padding:17px;border-radius:14px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--orange2),var(--orange));
  color:#fff;font-size:16px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 8px 24px rgba(255,107,0,.3);
  transition:all .2s;
}
.draw-btn:active{transform:scale(.97)}
.redraw-btn{
  width:100%;padding:12px;border-radius:12px;
  background:transparent;border:1px solid var(--br2);
  color:var(--tx2);font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  margin-bottom:8px;
}
.win-prob{
  background:var(--sf2);border-radius:12px;padding:14px;margin-bottom:12px;
  border:1px solid var(--br);
}
.win-prob-title{font-size:11px;color:var(--tx3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;text-align:center}
.win-prob-bar{height:8px;border-radius:4px;overflow:hidden;background:var(--br);display:flex}
.win-prob-a{height:100%;background:linear-gradient(90deg,var(--cyan),#0077ff);transition:width .6s ease}
.win-prob-b{height:100%;background:linear-gradient(90deg,var(--orange2),var(--orange));transition:width .6s ease}
.win-prob-labels{display:flex;justify-content:space-between;margin-top:6px}
.win-prob-label{font-size:11px;font-weight:700;color:var(--tx2)}

/* ══════════════════════════════════════════════════════
   LIVE MATCH
══════════════════════════════════════════════════════ */
.live-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,23,68,.15);border:1px solid rgba(255,23,68,.4);
  border-radius:6px;padding:4px 10px;font-size:11px;font-weight:800;
  color:var(--red);letter-spacing:1px;text-transform:uppercase;
  animation:livePulse 1.5s ease infinite;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.6}}

.match-clock{
  text-align:center;padding:24px;
  background:var(--sf2);border-radius:16px;margin-bottom:16px;
  border:1px solid var(--br);
}
.clock-time{
  font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:4px;
  color:var(--gold);text-shadow:0 0 30px rgba(255,214,0,.3);line-height:1;
}
.clock-label{font-size:11px;color:var(--tx3);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.clock-controls{display:flex;gap:8px;justify-content:center;margin-top:14px}
.clock-btn{
  padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;transition:all .2s;
}
.clock-btn.start{background:linear-gradient(135deg,var(--green),#00bfa5);color:#000;box-shadow:0 4px 12px rgba(0,230,118,.25)}
.clock-btn.stop{background:rgba(255,23,68,.2);border:1px solid rgba(255,23,68,.4);color:var(--red)}
.clock-btn.reset{background:var(--sf3);border:1px solid var(--br2);color:var(--tx2)}

.score-display{
  display:grid;grid-template-columns:1fr auto 1fr;gap:0;
  background:var(--sf2);border-radius:16px;margin-bottom:12px;
  border:1px solid var(--br);overflow:hidden;
}
.score-team{padding:16px 12px;text-align:center}
.score-team-name{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.score-goals{font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:1}
.score-team.team-a .score-goals{color:var(--cyan)}
.score-team.team-b .score-goals{color:var(--orange)}
.score-divider{
  display:flex;align-items:center;justify-content:center;padding:0 12px;
  font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--tx3);
  border-left:1px solid var(--br);border-right:1px solid var(--br);
}

.goal-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.goal-btn{
  padding:14px;border-radius:12px;font-size:14px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;transition:all .2s;text-align:center;
}
.goal-btn.team-a{background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);color:var(--cyan)}
.goal-btn.team-a:active{background:rgba(0,212,255,.3)}
.goal-btn.team-b{background:rgba(255,107,0,.15);border:1px solid rgba(255,107,0,.3);color:var(--orange)}
.goal-btn.team-b:active{background:rgba(255,107,0,.3)}

.event-timeline{margin-bottom:16px}
.event-item{
  display:flex;align-items:center;gap:10px;
  padding:10px;background:var(--sf2);border-radius:10px;margin-bottom:6px;
  border:1px solid var(--br);
}
.event-time{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);min-width:36px}
.event-icon{font-size:18px}
.event-text{font-size:13px;font-weight:600;flex:1}
.event-team{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}

/* ══════════════════════════════════════════════════════
   MVP VOTING
══════════════════════════════════════════════════════ */
.mvp-card{
  background:linear-gradient(135deg,rgba(255,214,0,.1),rgba(255,107,0,.05));
  border:1px solid rgba(255,214,0,.3);border-radius:16px;padding:20px;margin-bottom:16px;
}
.mvp-card-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:2px;color:var(--gold);margin-bottom:12px}
.mvp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mvp-option{
  padding:12px;border-radius:12px;border:1px solid var(--br);
  background:var(--sf2);text-align:center;cursor:pointer;transition:all .2s;
}
.mvp-option:active,.mvp-option.selected{
  border-color:var(--gold);
  background:rgba(255,214,0,.1);
}
.mvp-option-name{font-weight:700;font-size:13px}
.mvp-option-votes{font-size:11px;color:var(--tx3);margin-top:2px}

/* ══════════════════════════════════════════════════════
   RATING / CALIFICAR v2
══════════════════════════════════════════════════════ */

/* ── Player header card ── */
.rate-player-header{
  display:flex;align-items:center;gap:14px;margin-bottom:16px;
  background:var(--sf2);border-radius:16px;padding:16px;border:1px solid var(--br);
  position:relative;overflow:hidden;
}
.rate-player-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--cyan),#0077ff,transparent);
}
.rate-avatar{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),#0077ff);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:24px;color:#000;flex-shrink:0;
  box-shadow:0 4px 16px rgba(0,212,255,.3);
}
.rate-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:1px}
.rate-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.rate-overall-badge{
  margin-left:auto;
  font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;
  flex-shrink:0;
}

/* ── Radar container ── */
.rate-radar-wrap{
  background:var(--sf2);border:1px solid var(--br);border-radius:16px;
  padding:16px;margin-bottom:16px;text-align:center;
}
.rate-radar-title{
  font-size:10px;color:var(--tx3);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:12px;
}
.rate-radar-legend{display:flex;gap:12px;justify-content:center;margin-bottom:8px}
.rate-radar-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tx3)}
.rate-radar-leg-dot{width:8px;height:8px;border-radius:50%}

/* ── My overall vs avg display ── */
.rate-compare{
  display:grid;grid-template-columns:1fr auto 1fr;gap:0;
  background:var(--sf2);border:1px solid var(--br);border-radius:14px;
  margin-bottom:16px;overflow:hidden;
}
.rate-compare-col{padding:12px;text-align:center}
.rate-compare-col:first-child{border-right:1px solid var(--br)}
.rate-compare-col:last-child{border-left:1px solid var(--br)}
.rate-compare-val{font-family:'Bebas Neue',sans-serif;font-size:32px}
.rate-compare-lbl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.rate-compare-sep{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx3);padding:0 8px}

/* ── Sliders v2 ── */
.sliders-section{
  background:var(--sf2);border:1px solid var(--br);border-radius:16px;
  padding:16px;margin-bottom:16px;
}
.sliders-section-title{
  font-size:10px;color:var(--tx3);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:14px;
}
.slider-group{margin-bottom:14px}
.slider-group:last-child{margin-bottom:0}
.slider-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.slider-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx2)}
.slider-value{
  font-family:'Bebas Neue',sans-serif;font-size:22px;min-width:30px;text-align:right;
  transition:color .15s;
}
/* Filled track effect using background gradient */
.slider-input{
  -webkit-appearance:none;width:100%;height:4px;border-radius:3px;outline:none;cursor:pointer;
  background:var(--br);
  transition:background .1s;
}
.slider-input::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--thumb-color,var(--cyan));
  box-shadow:0 0 0 3px rgba(0,0,0,.4), 0 0 10px var(--thumb-glow,rgba(0,212,255,.4));
  cursor:pointer;
  transition:transform .12s, box-shadow .12s;
}
.slider-input:active::-webkit-slider-thumb{
  transform:scale(1.25);
  box-shadow:0 0 0 4px rgba(0,0,0,.4), 0 0 18px var(--thumb-glow,rgba(0,212,255,.5));
}
/* Avg tick mark */
.slider-track-wrap{position:relative}
.slider-avg-tick{
  position:absolute;top:50%;transform:translateY(-50%);
  width:2px;height:10px;background:rgba(255,255,255,.25);border-radius:1px;
  pointer-events:none;
}

/* ══════════════════════════════════════════════════════
   HISTORY v2 — Result-aware
══════════════════════════════════════════════════════ */
.history-item{
  background:var(--sf2);border:1px solid var(--br);border-radius:16px;
  margin-bottom:10px;overflow:hidden;
  transition:border-color .2s, transform .15s;
}
.history-item:active{transform:scale(.99)}
.history-item.win  {border-color:rgba(0,230,118,.35)}
.history-item.loss {border-color:rgba(255,23,68,.3)}
.history-item.draw {border-color:rgba(255,214,0,.3)}
.history-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 0;
}
.history-date{
  font-size:11px;color:var(--tx3);letter-spacing:.5px;
  display:flex;align-items:center;gap:5px;
}
.history-result-badge{
  font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 9px;border-radius:5px;
}
.history-result-badge.win  {background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.history-result-badge.loss {background:rgba(255,23,68,.12);color:var(--red);border:1px solid rgba(255,23,68,.3)}
.history-result-badge.draw {background:rgba(255,214,0,.12);color:var(--gold);border:1px solid rgba(255,214,0,.3)}
.history-scoreboard{
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:8px;align-items:center;padding:10px 14px 12px;
}
.history-team{text-align:center}
.history-team-name{
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;
}
.history-team-score{
  font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;transition:color .2s;
}
.history-team-ovr{font-size:10px;color:var(--tx3);margin-top:2px}
.history-team-players{font-size:10px;color:var(--tx3);margin-top:3px;line-height:1.4}
.history-team.winner .history-team-name{color:var(--green)}
.history-team.winner .history-team-score{color:var(--green);filter:drop-shadow(0 0 8px rgba(0,230,118,.4))}
.history-team.loser  .history-team-score{color:rgba(255,255,255,.2)}
.history-team.loser  .history-team-name{color:var(--tx3)}
.history-team.draw-side .history-team-score{color:var(--gold)}
.history-team.draw-side .history-team-name{color:var(--gold)}
.history-score-center{text-align:center}
.history-score-sep{
  font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--tx3);
  display:block;line-height:1;
}
.history-score-label{font-size:9px;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.history-footer{
  padding:8px 14px 10px;border-top:1px solid rgba(255,255,255,.04);

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, getDocs, arrayUnion, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ── CONFIG ── */
const firebaseConfig = {
  apiKey: "AIzaSyAW4bJNXEiffWr3Ha746eL1pp6D6Ib2bv4",
  authDomain: "applunesfc.firebaseapp.com",
  projectId: "applunesfc",
  storageBucket: "applunesfc.firebasestorage.app",
  messagingSenderId: "412960951744",
  appId: "1:412960951744:web:47a0022d90845551290c25",
  measurementId: "G-G8NBK410JL"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* ── CONSTANTS ── */
const SKILLS = ['Ataque','Velocidad','Defensa','Precisión','Potencia','Resistencia'];
const POSITIONS = { DEL:'Delantero', MED:'Mediocampo', DEF:'Defensor', ARQ:'Arquero' };
const ELO_RANKS = [
  { min:2000, name:'Leyenda', cls:'legend', icon:'👑' },
  { min:1700, name:'Diamante', cls:'diamond', icon:'💎' },
  { min:1400, name:'Oro', cls:'gold', icon:'🥇' },
  { min:1100, name:'Plata', cls:'silver', icon:'🥈' },
  { min:0,    name:'Bronce', cls:'bronze', icon:'🏅' },
];
const AVATAR_GRADIENTS = [
  'linear-gradient(135deg,#00d4ff,#0077ff)',
  'linear-gradient(135deg,#ff6b00,#cc0000)',
  'linear-gradient(135deg,#00e676,#00897b)',
  'linear-gradient(135deg,#ffd600,#ff6d00)',
  'linear-gradient(135deg,#7c3aed,#db2777)',
  'linear-gradient(135deg,#06b6d4,#6366f1)',
];

/* ── STATE ── */
let currentUser  = null;
let currentGroup = null;
let currentTab   = 'jugadores';
let groupMembers = [];
let groupUnsubscribe = null;

// Live Match State
let liveMatch = {
  active: false,
  timer: 0,
  timerInterval: null,
  scoreA: 0,
  scoreB: 0,
  events: [],
  teams: null,
};

/* ── HELPERS ── */
const v = id => document.getElementById(id)?.value?.trim() || '';
const showErr = (el, msg) => { el.textContent = msg; el.classList.add('show'); };
const hideErr = el => el.classList.remove('show');

let _tt;
function showToast(msg, dur=2500){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), dur);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
window.closeModal = closeModal;
function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function overallColor(v){
  if(v>=85) return 'var(--gold)';
  if(v>=70) return 'var(--green)';
  if(v>=50) return 'var(--cyan)';
  return 'var(--orange)';
}
function cardClass(v){
  if(v>=80) return 'elite';
  if(v>=60) return 'good';
  return 'avg';
}
function statBarClass(v){
  if(v>=80) return 'elite';
  if(v>=65) return 'good';
  if(v>=40) return 'avg';
  return 'low';
}
function getEloRank(elo){
  return ELO_RANKS.find(r => elo >= r.min) || ELO_RANKS[ELO_RANKS.length-1];
}
function avatarGradient(uid){
  const sum = uid ? uid.split('').reduce((a,c)=>a+c.charCodeAt(0),0) : 0;
  return AVATAR_GRADIENTS[sum % AVATAR_GRADIENTS.length];
}
function formatTimer(secs){
  const m = Math.floor(secs/60).toString().padStart(2,'0');
  const s = (secs%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

/* ── AUTH ── */
window.switchAuthTab = function(tab){
  document.querySelectorAll('.auth-tab').forEach((el,i) =>
    el.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('login-form').classList.toggle('active', tab==='login');
  document.getElementById('register-form').classList.toggle('active', tab==='register');
};

window.doRegister = async function(){
  const nombre=v('reg-nombre'), apellido=v('reg-apellido'), email=v('reg-email').toLowerCase();
  const pass=v('reg-pass'), edad=parseInt(v('reg-edad'))||0;
  const pie=v('reg-pie'), posicion=v('reg-posicion');
  const err = document.getElementById('reg-error');
  hideErr(err);
  if(!nombre||!apellido||!email||!pass||!edad) return showErr(err,'Completá todos los campos');
  if(pass.length<6) return showErr(err,'Contraseña mínimo 6 caracteres');
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db,'users',cred.user.uid),{
      uid:cred.user.uid, nombre, apellido, email, edad, pie, posicion,
      elo:1000, xp:0, level:1, mvpCount:0,

/* ── STATS & RATINGS ── */
const statsCache = {};

async function getPlayerStats(uid){
  try {
    const snap = await getDoc(doc(db,'ratings', currentGroup.id+'_'+uid));
    if(!snap.exists()) return {stats:{},overall:0};
    const data = snap.data();
    const stats = {};
    SKILLS.forEach(s=>{
      const vals = Object.values(data.ratings||{}).map(r=>r[s]).filter(v=>v!=null);
      stats[s] = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
    });
    const filled = Object.values(stats).filter(v=>v>0);
    const overall = filled.length ? Math.round(filled.reduce((a,b)=>a+b,0)/filled.length) : 0;
    return { stats, overall };
  } catch{ return {stats:{},overall:0}; }
}

async function getCachedStats(uid){
  if(!statsCache[uid]) statsCache[uid] = await getPlayerStats(uid);
  return statsCache[uid];
}
function invalidateCache(uid){ delete statsCache[uid]; }

async function saveRating(targetUid, skillRatings){
  if(targetUid===currentUser.uid){ showToast('⚠️ No podés calificarte a vos mismo'); return; }
  const ref = doc(db,'ratings', currentGroup.id+'_'+targetUid);
  const snap = await getDoc(ref);
  const existing = snap.exists() ? snap.data() : {ratings:{}};
  existing.ratings[currentUser.uid] = skillRatings;
  await setDoc(ref, existing);
  invalidateCache(targetUid);
}

function showTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(el=>{
    el.classList.remove('active','live-active');
  });
  const tabEl = document.getElementById('tab-'+tab);
  if(tabEl){
    // Live tab gets a special red state when a match is running
    if(tab==='live' && liveMatch.active){
      tabEl.classList.add('live-active');
    } else {
      tabEl.classList.add('active');
    }
    // Re-trigger bounce by cloning the icon
    const icon = tabEl.querySelector('.tab-icon');
    if(icon){
      const clone = icon.cloneNode(true);
      icon.replaceWith(clone);
    }
  }
  // Also keep the Live tab visually pulsing when a match is active, regardless of selected tab
  if(tab !== 'live' && liveMatch.active){
    const liveEl = document.getElementById('tab-live');
    if(liveEl) liveEl.classList.add('live-active');
  }
  const content = document.getElementById('main-content');
  content.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;padding:60px 0">

  const renders = {

    asistencia:renderAsistencia,
    equipos:renderEquipos,
    live:renderLive,
    calificar:renderCalificar,
    historial:renderHistorial,

  (renders[tab]||(() => {}))(content);
}

window.drawTeams = async function(){
  const att = await getAttendance();
  const confirmed = groupMembers.filter(u=>att[u.uid]);
  if(confirmed.length<4){ showToast('⚠️ No hay suficientes jugadores'); return; }
  const withOvr = await Promise.all(confirmed.map(async u=>({
    ...u, ovr:(await getCachedStats(u.uid)).overall||0
  })));
  // Serpentine sort for balance
  withOvr.sort((a,b)=>b.ovr-a.ovr);
  const teams = [[],[]];
  withOvr.forEach((p,i)=>{
    const round=Math.floor(i/2), inRound=i%2, team=round%2===0?inRound:1-inRound;
    teams[team].push(p);
  });
  // Shuffle within teams
  teams.forEach(t=>{ for(let i=t.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [t[i],t[j]]=[t[j],t[i]]; } });
  currentTeams = teams.map(t=>({
    players:t,
    avg:Math.round(t.reduce((s,p)=>s+p.ovr,0)/t.length)||0
  }));
  liveMatch.teams = currentTeams;
  renderTeamsResult();
};

function renderTeamsResult(){
  const el = document.getElementById('teams-result');
  if(!el||!currentTeams) return;
  const diff = Math.abs(currentTeams[0].avg - currentTeams[1].avg);
  const probA = Math.round(50 + (currentTeams[0].avg - currentTeams[1].avg));
  const probB = 100-probA;

  el.innerHTML = `
    <div class="win-prob">
      <div class="win-prob-title">Win Probability</div>
      <div class="win-prob-bar">
        <div class="win-prob-a" style="width:${Math.max(10,Math.min(90,probA))}%"></div>
        <div class="win-prob-b" style="width:${Math.max(10,Math.min(90,probB))}%"></div>

    timestamp:Date.now(),
    scoreA: liveMatch.scoreA||0,
    scoreB: liveMatch.scoreB||0,
    events: liveMatch.events||[],
    teams: currentTeams.map(t=>({
      avg:t.avg,
      players:t.players.map(p=>({uid:p.uid,nombre:p.nombre,apellido:p.apellido,ovr:p.ovr}))

  liveMatch.scoreA=0; liveMatch.scoreB=0; liveMatch.events=[];
};

window.toggleTimer = function(){
  if(liveMatch.active){
    stopLiveTimer();
  } else {
    liveMatch.active = true;
    liveMatch.timerInterval = setInterval(()=>{
      liveMatch.timer++;
      const el = document.getElementById('live-clock');
      if(el) el.textContent = formatTimer(liveMatch.timer);

  }
  showTab('live');
};

window.addGoal = function(team){
  if(team===0) liveMatch.scoreA++;
  else liveMatch.scoreB++;
  liveMatch.events.push({
    time:liveMatch.timer,
    icon:'⚽',
    text:`¡Goooool!`,

  });

/* ── Radar drawing helper ── */
function drawRateRadar(canvasId, myVals, avgVals){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R = Math.min(W,H)/2 - 20;
  const N = SKILLS.length;
  const angle = i => (i * 2*Math.PI/N) - Math.PI/2;

  ctx.clearRect(0,0,W,H);

  // Grid rings
  for(let r=0.25;r<=1;r+=0.25){
    ctx.beginPath();
    for(let i=0;i<N;i++){
      const a=angle(i), x=cx+Math.cos(a)*R*r, y=cy+Math.sin(a)*R*r;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=`rgba(255,255,255,${r===1?.12:.06})`;
    ctx.lineWidth=1;
    ctx.stroke();
  }

  // Axis lines + labels
  SKILLS.forEach((skill,i)=>{
    const a=angle(i);
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    ctx.strokeStyle='rgba(255,255,255,.08)';
    ctx.lineWidth=1;
    ctx.stroke();

    const lx=cx+Math.cos(a)*(R+14), ly=cy+Math.sin(a)*(R+14);
    ctx.fillStyle='rgba(160,180,204,.7)';
    ctx.font='bold 9px Rajdhani,sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(skill.toUpperCase().slice(0,3), lx, ly);
  });

  // Draw polygon helper
  function drawPoly(vals, fill, stroke){
    ctx.beginPath();
    vals.forEach((v,i)=>{
      const a=angle(i), r=(v/100)*R;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.strokeStyle=stroke;
    ctx.lineWidth=2;
    ctx.stroke();
  }

  // Avg polygon (gray, behind)
  if(avgVals){
    const avg = SKILLS.map(s=>avgVals[s]||0);
    drawPoly(avg,'rgba(90,112,144,.2)','rgba(90,112,144,.5)');
  }

  // My rating polygon (cyan, front)
  const my = SKILLS.map(s=>myVals[s]||0);
  drawPoly(my,'rgba(0,212,255,.15)','rgba(0,212,255,.85)');

  // Dots on vertices
  my.forEach((v,i)=>{
    const a=angle(i), r=(v/100)*R;
    ctx.beginPath();
    ctx.arc(cx+Math.cos(a)*r, cy+Math.sin(a)*r, 3.5, 0, Math.PI*2);
    ctx.fillStyle='var(--cyan, #00d4ff)'; // fallback for canvas
    ctx.fillStyle='#00d4ff';
    ctx.fill();
  });
}

/* ── Thumb color helper ── */
function sliderThumbColor(v){
  if(v>=85) return {color:'var(--gold)',glow:'rgba(255,214,0,.5)'};
  if(v>=70) return {color:'var(--green)',glow:'rgba(0,230,118,.4)'};
  if(v>=50) return {color:'var(--cyan)',glow:'rgba(0,212,255,.4)'};
  return {color:'var(--orange)',glow:'rgba(255,107,0,.4)'};
}

function updateSliderTracks(){

    if(!input) return;
    const v = rateSliders[s];
    const tc = sliderThumbColor(v);
    // Filled track: gradient from accent to dark
    input.style.background = `linear-gradient(to right, ${tc.color.replace('var(--cyan)','#00d4ff').replace('var(--green)','#00e676').replace('var(--gold)','#ffd600').replace('var(--orange)','#ff6b00')} 0%, ${tc.color.replace('var(--cyan)','#00d4ff').replace('var(--green)','#00e676').replace('var(--gold)','#ffd600').replace('var(--orange)','#ff6b00')} ${v}%, rgba(28,43,66,.8) ${v}%, rgba(28,43,66,.8) 100%)`;
    input.style.setProperty('--thumb-color', tc.color);
    input.style.setProperty('--thumb-glow', tc.glow);
  });
}

window.updateSlider = function(uid, skill, val){
  val = parseInt(val); rateSliders[skill] = val;
  const valEl = document.getElementById('sv_'+skill);
  if(valEl){ valEl.textContent=val; valEl.style.color=overallColor(val); }
  // Update radar live
  drawRateRadar('rate-radar-canvas', rateSliders, rateCurrentStats);
  // Update compare overall
  const myOvr = Math.round(SKILLS.reduce((a,s)=>a+(rateSliders[s]||0),0)/SKILLS.length);

  if(ovrEl){ ovrEl.textContent=myOvr; ovrEl.style.color=overallColor(myOvr); }

  updateSliderTracks();
};

      : '<div class="empty-state"><span class="icon">📋</span><div class="msg">Todavía no hay partidos guardados</div></div>'}
  `;
}
